
name: Safe Automation Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check Python
        run: python --version

      - name: Create Result
        run: echo "Automation working!" > result.txt

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: test-result
          path: result.txt
